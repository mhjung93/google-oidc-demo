<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d5f96"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b7a45"/></marker>
    <marker id="mOr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8641a"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3302f"/></marker>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker>
    <style>
      .halo { paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
      .lbl  { font-size: 19px; }
      .sm   { font-size: 16px; fill: #555; }
      .chip { font-size: 16px; font-weight: 600; }
      .name { font-size: 26px; font-weight: 700; fill: #1d1d1d; }
      .sub  { font-size: 20px; font-weight: 700; fill: #1d1d1d; }
      .num  { font-size: 22px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#fff"/>

  <!-- ===== opening arc (drawn first so boxes sit on top) ===== -->
  <path d="M1580 300 C1580 90 220 90 220 300" fill="none" stroke="#b3302f" stroke-width="4" marker-start="url(#mRed)" marker-end="url(#mRed)"/>
  <text x="430" y="262" class="lbl halo" fill="#b3302f"><tspan class="num">⑦</tspan>  opening — disputed only</text>
  <text x="1370" y="262" text-anchor="end" class="lbl halo" fill="#b3302f">transcript + D_svc   →   uid</text>
  <!-- operator on the arc -->
  <rect x="815" y="100" width="170" height="80" rx="14" fill="#fff" stroke="#b3302f" stroke-width="3"/>
  <g transform="translate(850 140)" fill="none" stroke="#b3302f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-12" r="9"/><path d="M-16 18 C-16 4 -8 0 0 0 C8 0 16 4 16 18"/>
  </g>
  <text x="878" y="147" class="sub" fill="#b3302f">Operator</text>
  <text x="900" y="215" text-anchor="middle" class="sm halo" fill="#b3302f">2-of-2 shares  +  operator approval</text>

  <!-- ===== the three boxes ===== -->
  <!-- AA -->
  <rect x="40" y="300" width="360" height="220" rx="18" fill="#f2f4f8" stroke="#8b96a8" stroke-width="3"/>
  <g transform="translate(92 352)" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0-28 L24-18 V4 C24 18 0 30 0 30 C0 30 -24 18 -24 4 V-18 Z"/><path d="M-10 1 L-3 8 L11 -7"/>
  </g>
  <text x="130" y="346" class="name">Authentication</text>
  <text x="130" y="376" class="name">Authority</text>
  <g class="chip" fill="#334">
    <rect x="60" y="400" width="220" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="170" y="419" text-anchor="middle">verifies C_u once</text>
    <rect x="60" y="440" width="220" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="170" y="459" text-anchor="middle">session records</text>
    <rect x="60" y="480" width="220" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="170" y="499" text-anchor="middle">revocation tree</text>
  </g>

  <!-- User / Wallet -->
  <rect x="720" y="300" width="360" height="220" rx="18" fill="#f2f4f8" stroke="#8b96a8" stroke-width="3"/>
  <g transform="translate(772 352)" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="-4" cy="-16" r="11"/><path d="M-24 22 C-24 4 -12 -2 -4 -2 C4 -2 16 4 16 22"/><rect x="6" y="6" width="28" height="20" rx="3"/><circle cx="28" cy="16" r="2.5" fill="#1d1d1d"/>
  </g>
  <text x="810" y="361" class="name">User · Wallet</text>
  <g class="chip" fill="#334">
    <rect x="740" y="400" width="200" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="840" y="419" text-anchor="middle">secrets sk_u, s_u</text>
    <rect x="740" y="440" width="200" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="840" y="459" text-anchor="middle">session key sk_i</text>
    <rect x="740" y="480" width="250" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="865" y="499" text-anchor="middle">builds π  (25 inputs)</text>
  </g>

  <!-- Service -->
  <rect x="1400" y="300" width="360" height="220" rx="18" fill="#f2f4f8" stroke="#8b96a8" stroke-width="3"/>
  <g transform="translate(1452 352)" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-26" y="-30" width="52" height="16" rx="3"/><rect x="-26" y="-8" width="52" height="16" rx="3"/><rect x="-26" y="14" width="52" height="16" rx="3"/>
    <circle cx="-17" cy="-22" r="2.5" fill="#1d1d1d"/><circle cx="-17" cy="0" r="2.5" fill="#1d1d1d"/><circle cx="-17" cy="22" r="2.5" fill="#1d1d1d"/>
  </g>
  <text x="1490" y="361" class="name">Service</text>
  <g class="chip" fill="#334">
    <rect x="1420" y="400" width="240" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="1540" y="419" text-anchor="middle">factory + verifier</text>
    <rect x="1420" y="440" width="240" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="1540" y="459" text-anchor="middle">policy set root</text>
    <rect x="1420" y="480" width="240" height="28" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="2"/><text x="1540" y="499" text-anchor="middle">private login log</text>
  </g>

  <!-- ===== arrows: AA ⇄ User ===== -->
  <path d="M720 350 H410" stroke="#222" stroke-width="4" marker-end="url(#mB)"/>
  <text x="560" y="339" text-anchor="middle" class="lbl halo"><tspan class="num">①</tspan> credential C_u + π_u  (once)</text>

  <path d="M410 420 H710" stroke="#222" stroke-width="4" marker-start="url(#mB)" marker-end="url(#mB)"/>
  <text x="560" y="409" text-anchor="middle" class="lbl halo"><tspan class="num">③</tspan> C_s + sig_u   ⇄   σ_AA</text>
  <text x="560" y="446" text-anchor="middle" class="sm halo">no proof · AA keeps a record</text>

  <path d="M720 490 H410" stroke="#b8641a" stroke-width="4" marker-end="url(#mOr)"/>
  <text x="560" y="479" text-anchor="middle" class="lbl halo" fill="#b8641a"><tspan class="num">⑥</tspan> revoke session / account</text>

  <!-- ===== arrows: User ⇄ Service ===== -->
  <path d="M1400 370 H1090" stroke="#0d5f96" stroke-width="4" stroke-dasharray="14 9" marker-end="url(#mBlue)"/>
  <text x="1240" y="359" text-anchor="middle" class="lbl halo" fill="#0d5f96"><tspan class="num">②</tspan> arid · r_s</text>

  <path d="M1080 450 H1390" stroke="#0d5f96" stroke-width="4" stroke-dasharray="14 9" marker-end="url(#mBlue)"/>
  <text x="1240" y="439" text-anchor="middle" class="lbl halo" fill="#0d5f96"><tspan class="num">④</tspan> PPID + π + σ</text>
  <text x="1240" y="476" text-anchor="middle" class="sm halo">not revoked ×2 · range / set · tag</text>

  <!-- ===== chain band ===== -->
  <rect x="40" y="700" width="1720" height="240" rx="18" fill="#f7f7f7" stroke="#8b96a8" stroke-width="3"/>
  <g transform="translate(92 740)" fill="none" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round">
    <rect x="-32" y="-12" width="22" height="22" rx="3"/><rect x="-11" y="-12" width="22" height="22" rx="3"/><rect x="10" y="-12" width="22" height="22" rx="3"/>
    <path d="M-10 -1 H-11 M11 -1 H10" stroke-width="5"/>
  </g>
  <text x="140" y="750" class="name">Chain</text>

  <rect x="100" y="780" width="440" height="130" rx="14" fill="#fff" stroke="#b8641a" stroke-width="3"/>
  <text x="320" y="815" text-anchor="middle" class="sub">Revocation log</text>
  <text x="320" y="848" text-anchor="middle" class="sm">root · heartbeat · append-only</text>
  <text x="320" y="878" text-anchor="middle" class="sm">leaves: user, session — look alike</text>

  <rect x="720" y="780" width="440" height="130" rx="14" fill="#fff" stroke="#1b7a45" stroke-width="3"/>
  <text x="940" y="815" text-anchor="middle" class="sub">PPID account</text>
  <text x="940" y="848" text-anchor="middle" class="sm">CREATE2(factory, PPID)</text>
  <text x="940" y="878" text-anchor="middle" class="sm">verifies π + σ_tx · nonce · root age</text>

  <rect x="1320" y="780" width="400" height="130" rx="14" fill="#fff" stroke="#8b96a8" stroke-width="3"/>
  <text x="1520" y="815" text-anchor="middle" class="sub">Target contract</text>
  <text x="1520" y="848" text-anchor="middle" class="sm">reads the 11-word tail</text>
  <text x="1520" y="878" text-anchor="middle" class="sm">e.g. age ≥ 18 · country ∈ set</text>

  <path d="M1160 845 H1310" stroke="#1b7a45" stroke-width="4" marker-end="url(#mGreen)"/>
  <text x="1235" y="834" text-anchor="middle" class="sm halo" fill="#1b7a45">call + tail</text>

  <!-- ===== vertical arrows to the chain ===== -->
  <path d="M320 520 V770" stroke="#b8641a" stroke-width="4" marker-end="url(#mOr)"/>
  <text x="338" y="640" class="lbl halo" fill="#b8641a"><tspan class="num">⑥</tspan> publish root</text>
  <text x="338" y="668" class="sm halo">next root kills the session</text>

  <path d="M900 520 V770" stroke="#1b7a45" stroke-width="4" marker-end="url(#mGreen)"/>
  <text x="918" y="640" class="lbl halo" fill="#1b7a45"><tspan class="num">⑤</tspan> execute( σ_tx , π )</text>
  <text x="918" y="668" class="sm halo">σ_tx binds 16 words · via any relayer</text>

  <path d="M770 520 L560 770" stroke="#777" stroke-width="3" stroke-dasharray="3 8" marker-start="url(#mGrey)" marker-end="url(#mGrey)"/>
  <text x="600" y="660" text-anchor="middle" class="sm halo">root, events</text>

  <path d="M1580 520 V690" stroke="#777" stroke-width="3" stroke-dasharray="3 8" marker-start="url(#mGrey)" marker-end="url(#mGrey)"/>
  <text x="1598" y="612" class="sm halo">root · head</text>

  <!-- ===== legend ===== -->
  <g transform="translate(60 978)">
    <path d="M0 -6 H40" stroke="#222" stroke-width="4"/><text x="50" y="0" class="sm">seen by the AA</text>
    <path d="M230 -6 H270" stroke="#0d5f96" stroke-width="4" stroke-dasharray="14 9"/><text x="280" y="0" class="sm">never seen by the AA</text>
    <path d="M500 -6 H540" stroke="#777" stroke-width="3" stroke-dasharray="3 8"/><text x="550" y="0" class="sm">read from the chain</text>
    <text x="760" y="0" class="sm">AA never learns:  which service · PPID · session key · tag · disclosed values</text>
  </g>
</svg>
