<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <title>Mode 3 RP</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    fieldset { border: 2px solid #1976d2; margin-bottom: 16px; }
    pre { background: #f6f6f6; padding: 10px; white-space: pre-wrap; font-size: 0.85em; }
    .ok { color: #2e7d32; font-weight: bold; } .bad { color: #c62828; font-weight: bold; }
    .muted { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h2>Mode 3 로그인 (RP)</h2>
  <p class="muted" id="rpInfo">RP 정보 불러오는 중…</p>
  <p class="muted" id="attrGateInfo">-</p>
  <p class="muted" id="walletMode">지갑 비밀 모드 확인 중…</p>

  <fieldset>
    <legend>로그인</legend>
    <label><input type="checkbox" id="allowAgent" /> 이번 세션에서 AI agent 동작 허용 (allowAgent, 덱 22장)</label><br />
    <label><input type="checkbox" id="requirePred" /> 속성 술어 요구(V7): 국가 ∈ 허용 집합, 올해 − 출생연도 ≥ minAge</label><br />
    <button id="loginBtn">Mode 3 로그인</button>
    <p id="verdict"></p>
    <pre id="log"></pre>
  </fieldset>

  <fieldset>
    <legend>세션 (로그인 뒤에 활성화)</legend>
    <p class="muted">현재 세션 r_s: <code id="sessionId">(없음)</code></p>
    <button id="revalidateBtn" disabled>세션 재검증</button>
    <label><input type="checkbox" id="skipSync" /> 동기화 생략(캐시된 π 재사용) — 폐기 후 <code>stale_root</code> 거절 시연</label>
    <br />
    <button id="requestBtn" disabled>세션 요청 (body: "hello")</button>
    <p id="sessionVerdict"></p>
    <pre id="sessionLog"></pre>
  </fieldset>

  <fieldset>
    <legend>이 RP 에 기록된 로그인 <button id="refreshLogins">새로고침</button></legend>
    <pre id="logins">-</pre>
    <p class="muted">개봉 요청(설계 2026-09-16 §6): PPID <input id="openPpid" size="24" /> <button id="openBtn">요청</button> <button id="openPollBtn" disabled>결과 확인</button></p>
    <p class="muted">해시로 개봉(트랜잭션은 지갑 페이지에서 보낸다): <input id="openTx" size="66" placeholder="0x…" /> <button id="openTxBtn">요청</button></p>
    <pre id="openLog">-</pre>
  </fieldset>

  <script>
    const $ = (id) => document.getElementById(id);
    let info = null;
    let currentSession = null;
    // 이 세션이 어떤 allowAgent 로 승인됐는지. 재승인(§4.3) 동의 창이 보여 주는 값이라 반드시 세션과 같아야 한다 —
    // /wallet/session/witness 는 세션의 allowAgent 를 바꾸지 않으므로, 여기서 '0' 으로 가정하면 사용자가 본 문구와
    // 실제 권한이 어긋난다. 모르면(페이지를 새로 고쳤다) 재승인하지 않고 다시 로그인하게 한다.
    let currentSessionAllowAgent = null;
    // 지갑 에이전트의 비밀 보관 방식(스펙 2026-09-22 metamask-snap Ruling 1). /wallet/config 를 못 읽으면 지금까지의
    // 동작(file 모드 — RP 페이지가 /wallet/login 을 직접 부른다)으로 본다.
    let walletCfg = { secrets: 'file' };
    // 그 기본값이 실제로 확인된 것인지 — 못 읽었다면 지갑이 snap 모드인데 file 모드로 잘못 보고 /wallet/login 을 직접 부를 수
    // 있다(그 경로에는 CORS 가 없어 브라우저가 막는다). 실패 문구가 원인을 짚도록 이 값을 본다.
    let walletCfgLoaded = false;
    const SERVICE_NAME = 'Mode 3 데모 RP';
    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
    const ms = (t0) => `${Date.now() - t0} ms`;
    /** 지갑·팝업이 준 문자열은 innerHTML 에 넣지 않는다(요청 경로의 echo 와 같은 이유). */
    function setVerdict(el, ok, text) {
      el.textContent = '';
      const sp = document.createElement('span');
      sp.className = ok ? 'ok' : 'bad';
      sp.textContent = text;
      el.appendChild(sp);
      return sp;
    }

    function setSession(r_s, allowAgent = null) {
      currentSession = r_s;
      currentSessionAllowAgent = r_s ? allowAgent : null;
      $('sessionId').textContent = r_s ? `${r_s.slice(0, 12)}…` : '(없음)';
      $('revalidateBtn').disabled = !r_s;
      $('requestBtn').disabled = !r_s;
    }

    async function loadInfo() {
      info = await (await fetch('/api/mode3/rp_info')).json();
      const pending = info.status !== 'approved';
      $('rpInfo').textContent = pending
        ? `등록 대기 중 (arid=${info.arid ?? '-'}) — CIA 관리자 페이지(/admin)에서 승인하면 활성화된다. 5초마다 확인.`
        : `arid=${info.arid}   origin=${info.origin}   cert_s=있음   pk_trace=있음   RevocationLog=${info.logAddress}   지갑 에이전트=${info.walletAgentOrigin}   pk_CIA=${info.pkCiaSource}   chainId=${info.chainId}   팩토리=${info.factoryAddress ?? '(없음)'}`;
      $('attrGateInfo').textContent = info.attrGateAddress
        ? `AttrGate=${info.attrGateAddress}   정책: 국가(a₁) ∈ {${info.predicates.allowedCountries.join(', ')}}, 올해 − 출생연도(a₀) ≥ ${info.predicates.minAge}`
        : 'AttrGate 없음(팩토리 미배포)';
      $('loginBtn').disabled = pending;
      await loadWalletConfig();
      if (pending) setTimeout(loadInfo, 5000);
    }
    // 지갑의 비밀 모드는 rp_info 에 없다 — 지갑 에이전트에 직접 묻는다(GET /wallet/config, RP 오리진에 CORS 허용).
    async function loadWalletConfig() {
      try {
        const r = await fetch(`${info.walletAgentOrigin}/wallet/config`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        walletCfg = { secrets: 'file', ...(await r.json()) };
        walletCfgLoaded = true;
      } catch (e) {
        walletCfg = { secrets: 'file' };
        walletCfgLoaded = false;
        $('walletMode').textContent = `지갑 설정(${info.walletAgentOrigin}/wallet/config)을 못 읽었다(${e.message}) — 일단 file 모드로 본다. `
          + '지갑 에이전트가 떠 있는지 확인하세요 — 지갑이 실제로 snap 모드라면 로그인이 CORS 로 막힌다.';
        return;
      }
      $('walletMode').textContent = walletCfg.secrets === 'snap'
        ? `지갑 비밀=snap — 로그인은 지갑 승인 팝업으로 간다(Snap=${walletCfg.snapId}).`
        : '지갑 비밀=file — 로그인은 지갑 에이전트를 직접 부른다(기존 경로).';
    }
    async function refreshLogins() {
      const { logins } = await (await fetch('/api/mode3/logins')).json();
      const discOf = (l) => l.disclosure && (l.disclosure.mask !== '0' || l.disclosure.set) ? `  disclose(mask=${l.disclosure.mask}): lo=${l.disclosure.lo.join(',')} hi=${l.disclosure.hi.join(',')}${l.disclosure.set ? ` set(sel=${l.disclosure.set.sel}, root=${l.disclosure.set.root.slice(0, 10)}…)` : ''}` : '';
      $('logins').textContent = logins.length ? logins.map((l) => `${l.at}  PPID=${l.PPID}  r_s=${l.r_s ?? ''}  root=${l.root.slice(0, 18)}…  allowAgent=${l.allowAgent}${discOf(l)}`).join('\n') : '(없음)';
    }
    // ---- 지갑 승인 팝업(스펙 2026-09-22 metamask-snap §3.4·§4.2·§4.3) ----
    // snap 모드에서는 /wallet/login 에 CORS 가 없다. RP 페이지가 지갑 오리진의 팝업을 열고, 팝업이 Snap 동의를 받아
    // 에이전트를 같은 오리진에서 부른 뒤 결과를 postMessage 로 돌려준다. 최종 제출(POST /api/mode3/login)은 지금처럼
    // RP 페이지가 한다 — 팝업은 RP 서버에 직접 내지 않는다.
    const POPUP_TIMEOUT_MS = 120_000;
    const POPUP_CLOSED_POLL_MS = 300;        // 창이 닫혔는지 보는 주기
    // 팝업은 결과를 보낸 뒤 스스로 닫는다(mode3/wallet.html 은 성공 200ms·실패 3000ms 뒤 close). 닫힘을 먼저 보더라도
    // 이미 큐에 있는 결과 메시지를 받을 수 있게 이만큼 기다렸다가 "결과 없이 닫혔다"로 판정한다.
    const POPUP_RESULT_GRACE_MS = 400;
    const popupError = (reason, message) => Object.assign(new Error(message), { reason });
    function authorizeViaPopup(request) {
      const walletOrigin = info.walletAgentOrigin;
      // 창 이름은 r_s 로 가른다 — 이름이 고정이면 로그인 팝업이 떠 있는 동안 다른 세션의 재승인(409)이 그 창을 재사용한다.
      const popup = window.open(`${walletOrigin}/?authorize=1`, `mode3-authorize-${request.r_s}`, 'width=480,height=680');
      if (!popup) return Promise.reject(popupError('popup_blocked', '팝업이 차단됐다 — 이 사이트의 팝업을 허용한 뒤 다시 시도하세요.'));
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (fn, v) => {
          if (done) return;
          done = true;
          clearTimeout(timer); clearInterval(closedPoll);
          window.removeEventListener('message', onMessage);
          fn(v);
        };
        const onMessage = (ev) => {
          // 지갑 오리진이, 그것도 우리가 연 그 창이 보낸 것만 본다(ev.source 는 심층 방어 — 같은 오리진의 다른 창·프레임
          // 이 끼어들지 못하게 한다). ready 는 오리진을 모른 채 '*' 로 오지만, 우리는 보낸 쪽을 보고 거른다.
          if (ev.origin !== walletOrigin || ev.source !== popup || !ev.data) return;
          if (ev.data.type === 'mode3-authorize-ready') { popup.postMessage({ type: 'mode3-authorize', ...request }, walletOrigin); return; }
          if (ev.data.type !== 'mode3-authorize-result') return;
          if (ev.data.r_s !== request.r_s) return;      // 다른 요청의 결과는 무시한다
          finish(resolve, ev.data.result ?? { ok: false, reason: 'bad_result' });
        };
        window.addEventListener('message', onMessage);
        const timer = setTimeout(() => {
          try { popup.close(); } catch { /* 이미 닫혔을 수 있다 */ }
          finish(reject, popupError('timeout', `승인 창이 ${POPUP_TIMEOUT_MS / 1000}초 안에 끝나지 않았다.`));
        }, POPUP_TIMEOUT_MS);
        const closedPoll = setInterval(() => {
          if (!popup.closed) return;
          clearInterval(closedPoll);
          setTimeout(() => finish(reject, popupError('popup_closed', '승인 창이 결과 없이 닫혔다.')), POPUP_RESULT_GRACE_MS);
        }, POPUP_CLOSED_POLL_MS);
      });
    }
    /** 팝업 요청 본문 — 로그인·재승인이 함께 쓴다(재승인은 r_s 만 있으면 된다). */
    const authorizeRequest = (extra) => ({
      arid: info.arid, origin: info.origin, cert_s: info.cert_s, pk_trace: info.pk_trace,
      serviceName: SERVICE_NAME, ...extra,
    });

    $('loginBtn').addEventListener('click', async () => {
      $('loginBtn').disabled = true; $('verdict').textContent = ''; $('log').textContent = '';
      const log = (s) => { $('log').textContent += s + '\n'; };
      try {
        if (!info) await loadInfo();
        const pred = $('requirePred').checked ? {
          disclose: [{ lo: '0', hi: String(new Date().getUTCFullYear() - Number(info.predicates.minAge)) }, null, null, null],
          set: { slot: 1, members: info.predicates.allowedCountries },
          require: { countrySet: true, minAge: true },
        } : null;
        let t0 = Date.now();
        const ch = await (await post('/api/mode3/challenge')).json().catch(() => ({}));
        // 503(factory_constants_unavailable·registration_pending)에는 r_s 가 없다 — 바로 구조분해해 slice 하면
        // 사유 대신 "Cannot read properties of undefined" 만 보인다(2026-09-23 최종 리뷰 M3). 본문의 reason 을 보여 주고 멈춘다.
        if (!ch.ok || !ch.r_s) {
          log(`1. 챌린지 실패 ${ms(t0)}: ${JSON.stringify(ch)}`);
          setVerdict($('verdict'), false, `로그인 불가: ${ch.reason ?? 'challenge_failed'}`);
          return;
        }
        const { r_s, factoryAddress, attrGateAddress } = ch;
        log(`1. r_s 발급 ${ms(t0)}: ${r_s.slice(0, 16)}…`);

        const allowAgent = $('allowAgent').checked ? '1' : '0';
        t0 = Date.now();
        let wb;
        if (walletCfg.secrets === 'snap') {
          log('2. 지갑 승인 팝업 — 지갑 창에서 MetaMask·Snap 동의를 확인하세요.');
          let result;
          try {
            result = await authorizeViaPopup(authorizeRequest({ r_s, allowAgent, factoryAddress, attrGateAddress, disclose: pred?.disclose ?? null, set: pred?.set ?? null }));
          } catch (e) {
            log(`2. 팝업 ${ms(t0)}: ${e.reason ?? ''} ${e.message}`);
            setVerdict($('verdict'), false, `로그인 실패 — ${e.message}`);
            return;
          }
          if (!result.ok) {
            log(`2. 팝업 ${ms(t0)}: ${result.reason ?? ''} ${result.detail ?? ''}`);
            setVerdict($('verdict'), false, `로그인 실패 — 지갑: ${result.reason ?? '알 수 없음'}`);
            return;
          }
          wb = result;
        } else {
          const w = await post(`${info.walletAgentOrigin}/wallet/login`, { arid: info.arid, origin: info.origin, cert_s: info.cert_s, pk_trace: info.pk_trace, r_s, allowAgent, factoryAddress, attrGateAddress, disclose: pred?.disclose ?? null, set: pred?.set ?? null });
          wb = await w.json().catch(() => ({}));
          if (w.status !== 200) {
            log(`2. 지갑 ${w.status} ${ms(t0)}: ${wb.reason ?? wb.error ?? ''} ${wb.detail ?? ''}`);
            setVerdict($('verdict'), false, `로그인 실패 — 지갑: ${wb.reason ?? w.status}`);
            return;
          }
        }
        const tm = wb.timings ?? {};
        log(`2. 지갑 π+σ ${ms(t0)} (동기화 ${tm.syncMs} ms, 발급 ${tm.issueMs} ms, 증명 ${tm.proveMs} ms, 캐시 히트=${wb.cacheHit}, 새 발급=${wb.issued})\n   root=${wb.root}`);

        t0 = Date.now();
        const r = await post('/api/mode3/login', { proof: wb.proof, publicSignals: wb.publicSignals, sig: wb.sig, r_s, require: pred?.require ?? null });
        const rb = await r.json();
        log(`3. RP 검증 ${ms(t0)}: ${JSON.stringify(rb)}\n   allowAgent=${rb.allowAgent}`);
        const discTxt = rb.ok && rb.disclosure && rb.disclosure.mask !== '0'
          ? ` 공개(mask=${rb.disclosure.mask}): lo=${rb.disclosure.lo.join(',')} hi=${rb.disclosure.hi.join(',')}` : '';
        if (rb.ok) {
          setVerdict($('verdict'), true, '로그인 성공');
          $('verdict').appendChild(document.createTextNode(` PPID=${rb.PPID}${discTxt}`));
        } else setVerdict($('verdict'), false, `거절: ${rb.reason}`);
        setSession(rb.ok ? rb.r_s : null, rb.ok ? rb.allowAgent : null);
        if (rb.ok) $('openPpid').value = rb.PPID;
        refreshLogins();
      } catch (e) {
        log(`오류: ${e.message}`);
        setVerdict($('verdict'), false, walletCfgLoaded
          ? `오류 — ${e.message}`
          : `오류 — 지갑 설정(/wallet/config)을 못 읽어 비밀 모드를 모른다. 지갑 에이전트(${info?.walletAgentOrigin ?? '?'})를 확인하세요.`);
      } finally { $('loginBtn').disabled = false; }
    });

    $('revalidateBtn').addEventListener('click', async () => {
      $('revalidateBtn').disabled = true; $('sessionVerdict').textContent = ''; $('sessionLog').textContent = '';
      const log = (s) => { $('sessionLog').textContent += s + '\n'; };
      try {
        const skipSync = $('skipSync').checked;
        let t0 = Date.now();
        const callRevalidate = async () => {
          const w = await post(`${info.walletAgentOrigin}/wallet/revalidate`, { r_s: currentSession, skipSync });
          return { status: w.status, body: await w.json().catch(() => ({})) };
        };
        let { status, body: wb } = await callRevalidate();
        // 지갑이 재시작해 세션 증인이 사라졌을 때(스펙 §4.3). 같은 팝업을 reauth 로 열어 동의를 다시 받고 한 번만 재시도한다.
        if (status === 409 && wb.reason === 'needs_consent' && walletCfg.secrets === 'snap') {
          // 재승인 동의 창은 이 세션이 실제로 가진 allowAgent 를 보여 줘야 한다. 모르면(페이지 새로고침 등) 진행하지 않는다.
          if (currentSessionAllowAgent !== '0' && currentSessionAllowAgent !== '1') {
            log(`세션 증인이 없는데 이 세션의 allowAgent 를 모른다(allowAgent=${currentSessionAllowAgent}).`);
            setVerdict($('sessionVerdict'), false, '재승인 불가 — 이 페이지는 세션의 AI agent 허용 여부를 모른다. 다시 로그인하세요.');
            return;
          }
          log(`세션 증인이 없다(지갑 재시작) — 재승인 팝업을 연다(allowAgent=${currentSessionAllowAgent}).`);
          let result;
          try {
            result = await authorizeViaPopup(authorizeRequest({ r_s: currentSession, reauth: true, allowAgent: currentSessionAllowAgent }));
          } catch (e) {
            log(`재승인 팝업 ${ms(t0)}: ${e.reason ?? ''} ${e.message}`);
            setVerdict($('sessionVerdict'), false, `재검증 실패 — ${e.message}`);
            return;
          }
          if (!result.ok) {
            log(`재승인 거절/실패: ${result.reason ?? ''} ${result.detail ?? ''}`);
            setVerdict($('sessionVerdict'), false, `재승인 실패 — 지갑: ${result.reason ?? '알 수 없음'}`);
            return;
          }
          log('재승인 완료 — 재검증을 다시 시도한다.');
          t0 = Date.now();
          ({ status, body: wb } = await callRevalidate());
        }
        if (status !== 200) {
          log(`지갑 ${status} ${ms(t0)}: ${wb.reason ?? wb.error ?? ''}`);
          setVerdict($('sessionVerdict'), false, `재검증 실패 — 지갑: ${wb.reason ?? status}`);
          if (wb.reason === 'revoked') setSession(null);
          return;
        }
        log(`지갑 π+σ ${ms(t0)} (캐시 히트=${wb.cacheHit})\n   root=${wb.root}`);
        t0 = Date.now();
        const r = await post('/api/mode3/revalidate', { proof: wb.proof, publicSignals: wb.publicSignals, sig: wb.sig, r_s: currentSession });
        const rb = await r.json();
        log(`RP 재검증 ${ms(t0)}: ${JSON.stringify(rb)}`);
        setVerdict($('sessionVerdict'), rb.ok, rb.ok ? '재검증 성공' : `거절: ${rb.reason}`);
      } catch (e) {
        log(`오류: ${e.message}`);
        setVerdict($('sessionVerdict'), false, '오류');
      } finally { $('revalidateBtn').disabled = !currentSession; }
    });

    $('requestBtn').addEventListener('click', async () => {
      $('requestBtn').disabled = true; $('sessionVerdict').textContent = ''; $('sessionLog').textContent = '';
      const log = (s) => { $('sessionLog').textContent += s + '\n'; };
      try {
        const body = 'hello';
        let t0 = Date.now();
        const w = await post(`${info.walletAgentOrigin}/wallet/request`, { r_s: currentSession, body });
        const wb = await w.json().catch(() => ({}));
        if (w.status !== 200) {
          log(`지갑 ${w.status} ${ms(t0)}: ${wb.reason ?? wb.error ?? ''}`);
          setVerdict($('sessionVerdict'), false, `요청 실패 — 지갑: ${wb.reason ?? w.status}`);
          return;
        }
        log(`지갑 σ ${ms(t0)}`);
        t0 = Date.now();
        const r = await post('/api/mode3/request', { r_s: currentSession, body, sig: wb.sig });
        const rb = await r.json();
        log(`RP 요청 ${ms(t0)}: ${JSON.stringify(rb)}`);
        // echo 는 서버가 되돌린 요청 본문(자유 문자열)이라 innerHTML 에 넣지 않는다.
        const sv = $('sessionVerdict');
        setVerdict(sv, rb.ok, rb.ok ? '요청 성공' : `거절: ${rb.reason}`);
        if (rb.ok) sv.appendChild(document.createTextNode(` echo=${rb.echo}`));
      } catch (e) {
        log(`오류: ${e.message}`);
        setVerdict($('sessionVerdict'), false, '오류');
      } finally { $('requestBtn').disabled = !currentSession; }
    });

    let openingId = null;
    $('openBtn').addEventListener('click', async () => {
      const PPID = $('openPpid').value.trim();
      const r = await post('/api/mode3/open', { PPID }); const b = await r.json().catch(() => ({}));
      $('openLog').textContent = `요청 → ${r.status} ${JSON.stringify(b)}`;
      openingId = b.id ?? null; $('openPollBtn').disabled = !openingId;
    });
    $('openTxBtn').addEventListener('click', async () => {
      const txHash = $('openTx').value.trim();
      const r = await post('/api/mode3/open', { txHash }); const b = await r.json().catch(() => ({}));
      $('openLog').textContent = `요청 → ${r.status} ${JSON.stringify(b)}`;
      openingId = b.id ?? null; $('openPollBtn').disabled = !openingId;
    });
    $('openPollBtn').addEventListener('click', async () => {
      const r = await fetch(`/api/mode3/open/${openingId}`); const b = await r.json().catch(() => ({}));
      $('openLog').textContent += `\n결과 → ${r.status} ${JSON.stringify(b)}`;
      if (b.allowAgent != null) $('openLog').textContent += `\nAI agent ${b.allowAgent === '1' ? '허용됨' : '허용 안 됨'}`;
    });

    $('refreshLogins').addEventListener('click', refreshLogins);
    loadInfo().then(refreshLogins);
  </script>
</body>
</html>
