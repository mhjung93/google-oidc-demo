<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <!-- 제목의 "IdP 인증" 은 페이지 서빙 검사 marker 다(mode3/cia_admin.html 의 관례). 데모 바 없음 — 지갑 팝업 창이 이 페이지로 왔다가 돌아간다
       (2026-11-05, ?return=1·auid=…) — 옛 방식(지갑 팝업이 따로 연 창, postMessage 로 코드 전달)도 그대로 받는다. -->
  <title>zkID 로그인</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1d3a'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3Ezk%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/common/demo.css" />
  <link rel="stylesheet" href="/common/idp.css" />
  <script src="/common/strings.js"></script>
  <script src="/common/gsi.js"></script>   <!-- 2026-11-09 연결 로그인: method=google 일 때만 버튼을 그린다 -->
</head>
<body data-page="idp_login">
<main class="cards">
  <section class="card" id="authCard">
    <h3 id="authTitle" data-i18n="idp_auth_title">zkID 로그인</h3>
    <p id="authDesc" class="desc" data-i18n="idp_auth_desc">uid·비밀번호·auid 를 모두 직접 넣으면 지갑으로 돌아가 로그인을 이어갑니다.</p>
    <form id="authForm" class="auth-form" autocomplete="on">
      <label id="authUidRow"><span data-i18n="idp_auth_uid_label">uid</span><input id="authUid" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="uid" /></label>   <!-- 2026-11-09(사용자 결정): uid·비밀번호·auid 를 모두 손으로 넣는다(아이디도 받는다) -->
      <label id="authPwdRow"><span data-i18n="idp_pwd_label">비밀번호</span><input id="authPwd" type="password" autocomplete="current-password" /></label>
      <!-- 2026-11-09 연결 로그인: method=google|naver 면 아이디·비밀번호 대신 공급자 인증. Google 은 GIS 버튼, 네이버는 IdP 서버를 거쳐 다녀온다(ticket). -->
      <div id="authExtRow" hidden>
        <div id="authGsiSlot" class="gsi-slot"></div>
        <button id="authNaverBtn" type="button" hidden data-i18n="idp_auth_naver_btn">네이버로 인증</button>
      </div>
      <!-- 2026-11-09(사용자 결정): auid 도 늘 직접 넣는다 — 지갑은 더 이상 쿼리로 넘기지 않는다(2026-11-05 의 자동 채움을 되돌림). 값은 지갑 계정 탭 "상세" 의 auid 복사 버튼으로. -->
      <label id="authAuidRow">auid<input id="authAuid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="지갑 계정 탭 → 상세 → auid 복사" /><small class="muted" data-i18n="idp_auth_auid_hint">지갑 페이지의 계정 탭 "상세" 에서 auid 를 복사해 붙여 넣으세요.</small></label>
      <button id="authGo" type="submit" data-i18n="idp_auth_go">로그인</button>
      <button id="authCancel" type="button" class="btn-ghost" data-i18n="idp_auth_cancel">취소</button>   <!-- 2026-11-05: 실패했을 때 돌아갈 길 — 창을 닫는다(RP 쪽에는 "창이 닫혔습니다") -->
    </form>
    <p class="muted"><span data-i18n="idp_auth_signup_hint">계정이 없으면 새 탭에서 가입하고 지갑을 등록한 뒤 다시 로그인하세요.</span> <a id="authSignup" href="/user" target="_blank" rel="noopener" data-i18n="idp_auth_signup">계정 만들기</a></p>
    <div id="authVerdict"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // 리뷰(2026-11-03) M-3: 아래 비동기 초기화(health 조회)가 끝나기 전에 Enter 를 누르면 기본 GET 제출이 nonce·wallet 쿼리를 날린다 — 먼저 동기로 막는다.
  $('authForm').addEventListener('submit', (ev) => ev.preventDefault());
  // Demo 가 없다(이 창은 데모 바를 쓰지 않는다) — strings.js 만으로 최소한의 t()·사유·판정 카드를 흉내 낸다
  // (mode3/cia_account.html 의 Demo 대체 사본과 같은 관례).
  const Demo = {
    lang: 'ko',
    t(k, vars = {}) { const e = window.DemoStrings?.ui?.[k]; let s = e ? e.ko : k; for (const [n, v] of Object.entries(vars)) s = s.split(`{${n}}`).join(String(v)); return s; },
    reason(code) { const r = window.DemoStrings?.reasons?.[code]; return r ? r.ko : null; },
    verdict(el, args) {
      const { ok, title, summary, reason, detail, pending } = typeof args === 'function' ? args() : args;
      el.innerHTML = ''; el.className = `verdict ${pending ? 'pending' : ok ? 'ok' : 'bad'}`;
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = pending ? '…' : ok ? '✓' : '✕'; el.appendChild(badge);
      const h = document.createElement('strong'); h.textContent = window.DemoStrings?.verdicts?.[title]?.ko ?? Demo.t(title); el.appendChild(h);
      const r = reason ? Demo.reason(reason) : null;
      if (summary || r) { const p = document.createElement('p'); p.textContent = summary ?? r.title; el.appendChild(p); }
      if (r && !ok) { const c = document.createElement('p'); c.className = 'cause'; c.textContent = r.cause; el.appendChild(c); const a = document.createElement('p'); a.className = 'action'; a.textContent = r.action; el.appendChild(a); }
      // 2026-11-05(7차): 사유 코드·원문은 공통 카드(demo.js renderVerdict)와 같이 화면에 싣지 않고 콘솔에만 남긴다.
      if (!ok && !pending && (reason || detail !== undefined)) { try { console.debug('[verdict]', title, reason ?? '', detail ?? ''); } catch { /* 콘솔 없음 */ } }
    },
  };
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = Demo.t(el.dataset.i18n); });
  const setVerdict = (el, ok, title, extra) => Demo.verdict(el, () => ({ ok, title, ...(typeof extra === 'function' ? extra() : extra) }));
  const disableForm = () => { for (const id of ['authUid', 'authPwd', 'authAuid', 'authGo', 'authNaverBtn']) $(id).disabled = true; $('authGsiSlot').hidden = true; };
  const clearPwd = () => { $('authPwd').value = ''; };

  const q = new URLSearchParams(location.search);
  const nonce = q.get('nonce');
  const walletQuery = q.get('wallet');
  // 2026-11-05: return=1 이면 지갑 팝업 창 자체가 여기로 온 것 — 성공하면 코드를 그 지갑 오리진의 /?authorize=1 로 돌려보낸다(opener 는 RP 페이지라 postMessage 로는 못 준다).
  const returnToWallet = q.get('return') === '1';
  // 등록 모드(2026-11-09, 사용자 결정): 미등록 지갑의 첫 서비스 로그인 — 지갑 팝업이 purpose=register 로 온다. auid 칸을 숨기고 아이디·비밀번호만 받아 등록 코드·uid 를 돌려준다.
  const purpose = q.get('purpose') === 'register' ? 'register' : 'issue';
  // 연결 로그인(2026-11-09): RP 의 Google·네이버 버튼으로 왔으면 지갑 팝업이 method 를 붙인다. ext = 지금까지 받은 공급자 인증({ method, id_token|ticket }).
  const method = ['google', 'naver'].includes(q.get('method')) ? q.get('method') : 'password';
  const providerName = Demo.t(method === 'naver' ? 'idp_links_naver' : 'idp_links_google');
  let ext = method === 'naver' && /^[0-9a-f]{64}$/.test(q.get('ticket') ?? '') ? { method: 'naver', ticket: q.get('ticket') } : null;
  const setText = (id, k, vars) => { const el = $(id); if (el) { el.dataset.i18n = k; el.textContent = Demo.t(k, vars); } };
  if (purpose === 'register') {
    $('authAuidRow').hidden = true;
    for (const [id, k] of [['authTitle', 'idp_auth_register_title'], ['authDesc', 'idp_auth_register_desc'], ['authGo', 'idp_auth_register_go']]) setText(id, k);
  }
  if (method !== 'password') {
    $('authUidRow').hidden = true; $('authPwdRow').hidden = true; $('authExtRow').hidden = false;
    if (purpose === 'issue') { setText('authTitle', `idp_auth_${method}_title`); setText('authDesc', `idp_auth_${method}_desc`); setText('authGo', 'idp_auth_continue'); }
    else setText('authDesc', 'idp_auth_ext_register_desc', { provider: providerName });
    $('authGo').disabled = !ext;
    if (q.has('ticket') || q.has('auth_error')) { const u = new URL(location.href); u.searchParams.delete('ticket'); u.searchParams.delete('auth_error'); history.replaceState(null, '', u.toString()); }   // 1회용 값이 주소창·히스토리에 남지 않게
  }

  (async () => {
    // 2026-11-05(7차): nonce·wallet 이 아예 없으면(주소창에 직접 침) 보안 경고가 아니라 "지갑이 여는 창" 안내만 — 경고는 wallet 이 있는데 다를 때.
    if (!nonce || !walletQuery) { setVerdict($('authVerdict'), false, 'idp_auth_no_wallet', { pending: true, summary: Demo.t('idp_auth_no_wallet_hint') }); disableForm(); return; }
    let walletOrigin;
    try { walletOrigin = (await (await fetch('/mode3/health')).json()).walletOrigin; }
    catch { setVerdict($('authVerdict'), false, 'idp_auth_bad_wallet', { reason: 'idp_auth_bad_wallet' }); disableForm(); return; }
    // 쿼리의 wallet 이 이 IdP 가 아는 지갑 오리진과 글자 그대로 같아야 한다 — 다르면 가짜 창일 수 있다(§4).
    if (!walletOrigin || walletQuery !== walletOrigin) { setVerdict($('authVerdict'), false, 'idp_auth_bad_wallet', { reason: 'idp_auth_bad_wallet' }); disableForm(); return; }

    // M4: 로그인을 시도했지만 실패했고(예: auid_mismatch) 사용자가 재시도 없이 이 창을 닫으면, 지갑은 "응답 없음"으로만
    // 본다 — 성공 메시지와 같은 대상 오리진(walletOrigin, 지금 검증한 값 하나)으로 실패 사유를 opener 에 알린다.
    let lastReason = null;
    window.addEventListener('pagehide', () => {
      if (lastReason && !returnToWallet) window.opener?.postMessage({ type: 'mode3-idp-auth', nonce, error: lastReason }, walletOrigin);
    });

    // 취소(2026-11-05): 팝업이면 닫는다(지갑 팝업이 온 길이면 RP 가 popup_closed 를 받는다). 스크립트가 열지 않은 창이라 못 닫히면 뒤로 간다.
    $('authCancel').addEventListener('click', () => { window.close(); setTimeout(() => { if (!window.closed) history.back(); }, 100); });

    // 공급자 인증(2026-11-09). Google: IdP 가 낸 1회용 nonce(auth:)로 GIS 버튼을 그린다. 네이버: 쿼리를 IdP 에 맡기고 다녀온다 — 돌아오면 ticket 이 붙는다.
    const extReady = () => { $('authGo').disabled = false; setVerdict($('authVerdict'), true, Demo.t('idp_auth_ext_done', { provider: providerName }), { pending: true }); };
    if (method === 'naver') {
      $('authNaverBtn').hidden = Boolean(ext);
      if (q.get('auth_error')) { lastReason = q.get('auth_error'); setVerdict($('authVerdict'), false, 'idp_login_failed', { reason: lastReason }); }
      else if (ext) extReady();
      $('authNaverBtn').addEventListener('click', () => {
        const ctx = new URLSearchParams(location.search); ctx.delete('ticket'); ctx.delete('auth_error');
        lastReason = null;   // 리뷰 Minor 4: 다시 시도하러 떠나는 것 — pagehide 가 지난 실패를 opener 에 알리지 않게
        location.assign(`/cia/oidc/naver/start?purpose=auth&ctx=${encodeURIComponent(ctx.toString())}`);
      });
    } else if (method === 'google') {
      try {
        const cfg = (await (await fetch('/cia/public_keys')).json()).oidc?.providers?.google;
        if (!cfg?.enabled) throw Object.assign(new Error('provider_disabled'), { reason: 'provider_disabled' });
        if (!window.Mode3Gsi?.originOk()) throw Object.assign(new Error('gsi_origin'), { reason: 'gsi_origin' });
        const n = await (await fetch('/cia/oidc/nonce', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ purpose: 'auth' }) })).json();
        await window.Mode3Gsi.render({ el: $('authGsiSlot'), clientId: cfg.clientId, nonce: n.nonce, onToken: (tok) => { if (tok) { ext = { method: 'google', id_token: tok }; extReady(); } } });
      } catch (e) { lastReason = e.reason ?? 'gsi_unavailable'; setVerdict($('authVerdict'), false, 'idp_login_failed', { reason: lastReason, detail: e.message }); }
    }
    $('authForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      // 2026-11-03: 아이디로 로그인한다 — 서버(/cia/auth/code)가 아이디 색인에 없으면 10진 uid 로도 본다(옛 흐름·테스트 호환).
      const who = method === 'password' ? { id: $('authUid').value.trim(), pwd: $('authPwd').value } : ext;
      if (!who) return;
      const body = purpose === 'register' ? { ...who, purpose } : { ...who, auid: $('authAuid').value.trim() };
      Demo.verdict($('authVerdict'), { pending: true, title: Demo.t('working') || '처리 중' });
      let r;
      try {
        const resp = await fetch('/cia/auth/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) });
        r = { status: resp.status, body: await resp.json().catch(() => null) };
      } catch (e) { clearPwd(); setVerdict($('authVerdict'), false, 'idp_login_failed', { detail: e.message }); return; }
      if (r.status === 200) {
        clearPwd();
        lastReason = null;
        disableForm();
        if (returnToWallet) {
          // 지갑 팝업 창이 온 길 — 대상은 지금 검증한 지갑 오리진 하나, 경로는 고정(/?authorize=1). nonce·code 를 쿼리로 돌려준다(mode3/wallet.html takeIdpReturn).
          setVerdict($('authVerdict'), true, 'idp_auth_sent_title', { summary: Demo.t('idp_auth_return') });
          const u = new URL('/', walletOrigin); u.searchParams.set('authorize', '1'); u.searchParams.set('idp_nonce', nonce); u.searchParams.set('idp_code', r.body.code);
          if (purpose === 'register') { u.searchParams.set('idp_purpose', 'register'); u.searchParams.set('idp_uid', String(r.body.uid)); }   // 등록 코드는 uid 와 함께 — 지갑이 Snap register({uid}) 에 쓴다
          location.replace(u.toString());
          return;
        }
        // nonce·code 만 건넨다 — 대상 오리진은 *가 아니라 지금 검증한 지갑 오리진 하나뿐이다(addendum "대상 오리진 은 지갑 오리진").
        window.opener?.postMessage({ type: 'mode3-idp-auth', nonce, code: r.body.code }, walletOrigin);
        setVerdict($('authVerdict'), true, 'idp_auth_sent_title', { summary: Demo.t('idp_auth_sent') });
        setTimeout(() => window.close(), 300);
      } else {
        clearPwd();
        lastReason = r.body?.reason ?? `http_${r.status}`;
        setVerdict($('authVerdict'), false, 'idp_login_failed', { reason: r.body?.reason ?? `HTTP ${r.status}`, detail: r.body });
      }
    });
  })();
</script>
</body>
</html>
