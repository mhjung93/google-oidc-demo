<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <!-- 제목의 "IdP 인증" 은 페이지 서빙 검사 marker 다(mode3/cia_admin.html 의 관례). 데모 바 없음 — 지갑 팝업이 여는 좁은 창. -->
  <title>IdP 인증</title>
  <link rel="stylesheet" href="/common/demo.css" />
  <link rel="stylesheet" href="/common/idp.css" />
  <script src="/common/strings.js"></script>
</head>
<body data-page="idp_login">
<main class="cards">
  <section class="card" id="authCard">
    <h3 data-i18n="idp_auth_title">로그인 인증</h3>
    <p class="desc" data-i18n="idp_auth_desc">아이디·비밀번호·auid 를 넣으면 1회용 코드를 지갑에 전달합니다.</p>
    <form id="authForm" class="auth-form" autocomplete="on">
      <label><span data-i18n="idp_id_label">아이디</span><input id="authUid" autocomplete="username" autocapitalize="off" spellcheck="false" /><small class="muted" data-i18n="idp_auth_id_hint">아이디 또는 uid</small></label>
      <label><span data-i18n="idp_pwd_label">비밀번호</span><input id="authPwd" type="password" autocomplete="current-password" /></label>
      <label>auid<input id="authAuid" autocomplete="off" /></label>
      <button id="authGo" type="submit" data-i18n="idp_auth_go">확인</button>
    </form>
    <div id="authVerdict"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // 리뷰(2026-11-03) M-3: 아래 비동기 초기화(health 조회)가 끝나기 전에 Enter 를 누르면 기본 GET 제출이 nonce·wallet 쿼리를 날린다 — 먼저 동기로 막는다.
  $('authForm').addEventListener('submit', (ev) => ev.preventDefault());
  // Demo 가 없다(이 창은 데모 바를 쓰지 않는다) — strings.js 만으로 최소한의 t()·사유·판정 카드를 흉내 낸다
  // (mode3/cia_account.html 의 Demo 대체 사본과 같은 관례).
  const Demo = {
    lang: 'ko',
    t(k, vars = {}) { const e = window.DemoStrings?.ui?.[k]; let s = e ? e.ko : k; for (const [n, v] of Object.entries(vars)) s = s.split(`{${n}}`).join(String(v)); return s; },
    reason(code) { const r = window.DemoStrings?.reasons?.[code]; return r ? r.ko : null; },
    verdict(el, args) {
      const { ok, title, summary, reason, detail, pending } = typeof args === 'function' ? args() : args;
      el.innerHTML = ''; el.className = `verdict ${pending ? 'pending' : ok ? 'ok' : 'bad'}`;
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = pending ? '…' : ok ? '✓' : '✕'; el.appendChild(badge);
      const h = document.createElement('strong'); h.textContent = window.DemoStrings?.verdicts?.[title]?.ko ?? Demo.t(title); el.appendChild(h);
      const r = reason ? Demo.reason(reason) : null;
      if (summary || r) { const p = document.createElement('p'); p.textContent = summary ?? r.title; el.appendChild(p); }
      if (r && !ok) { const c = document.createElement('p'); c.className = 'cause'; c.textContent = r.cause; el.appendChild(c); const a = document.createElement('p'); a.className = 'action'; a.textContent = r.action; el.appendChild(a); }
      if (reason) { const code = document.createElement('code'); code.className = 'reason'; code.textContent = reason; el.appendChild(code); }
      if (detail !== undefined) { const pre = document.createElement('pre'); pre.textContent = typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2); el.appendChild(pre); }
    },
  };
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = Demo.t(el.dataset.i18n); });
  const setVerdict = (el, ok, title, extra) => Demo.verdict(el, () => ({ ok, title, ...(typeof extra === 'function' ? extra() : extra) }));
  const disableForm = () => { for (const id of ['authUid', 'authPwd', 'authAuid', 'authGo']) $(id).disabled = true; };
  const clearPwd = () => { $('authPwd').value = ''; };

  const q = new URLSearchParams(location.search);
  const nonce = q.get('nonce');
  const walletQuery = q.get('wallet');

  (async () => {
    if (!nonce || !walletQuery) { setVerdict($('authVerdict'), false, 'idp_auth_bad_wallet', { reason: 'idp_auth_bad_wallet' }); disableForm(); return; }
    let walletOrigin;
    try { walletOrigin = (await (await fetch('/mode3/health')).json()).walletOrigin; }
    catch { setVerdict($('authVerdict'), false, 'idp_auth_bad_wallet', { reason: 'idp_auth_bad_wallet' }); disableForm(); return; }
    // 쿼리의 wallet 이 이 IdP 가 아는 지갑 오리진과 글자 그대로 같아야 한다 — 다르면 가짜 창일 수 있다(§4).
    if (!walletOrigin || walletQuery !== walletOrigin) { setVerdict($('authVerdict'), false, 'idp_auth_bad_wallet', { reason: 'idp_auth_bad_wallet' }); disableForm(); return; }

    // M4: 로그인을 시도했지만 실패했고(예: auid_mismatch) 사용자가 재시도 없이 이 창을 닫으면, 지갑은 "응답 없음"으로만
    // 본다 — 성공 메시지와 같은 대상 오리진(walletOrigin, 지금 검증한 값 하나)으로 실패 사유를 opener 에 알린다.
    let lastReason = null;
    window.addEventListener('pagehide', () => {
      if (lastReason) window.opener?.postMessage({ type: 'mode3-idp-auth', nonce, error: lastReason }, walletOrigin);
    });

    $('authForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      // 2026-11-03: 아이디로 로그인한다 — 서버(/cia/auth/code)가 아이디 색인에 없으면 10진 uid 로도 본다(옛 흐름·테스트 호환).
      const body = { id: $('authUid').value.trim(), pwd: $('authPwd').value, auid: $('authAuid').value.trim() };
      Demo.verdict($('authVerdict'), { pending: true, title: Demo.t('working') || '처리 중' });
      let r;
      try {
        const resp = await fetch('/cia/auth/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) });
        r = { status: resp.status, body: await resp.json().catch(() => null) };
      } catch (e) { clearPwd(); setVerdict($('authVerdict'), false, 'idp_login_failed', { detail: e.message }); return; }
      if (r.status === 200) {
        clearPwd();
        lastReason = null;
        // nonce·code 만 건넨다 — 대상 오리진은 *가 아니라 지금 검증한 지갑 오리진 하나뿐이다(addendum "대상 오리진 은 지갑 오리진").
        window.opener?.postMessage({ type: 'mode3-idp-auth', nonce, code: r.body.code }, walletOrigin);
        setVerdict($('authVerdict'), true, 'idp_auth_sent_title', { summary: Demo.t('idp_auth_sent') });
        setTimeout(() => window.close(), 300);
      } else {
        clearPwd();
        lastReason = r.body?.reason ?? `http_${r.status}`;
        setVerdict($('authVerdict'), false, 'idp_login_failed', { reason: r.body?.reason ?? `HTTP ${r.status}`, detail: r.body });
      }
    });
  })();
</script>
</body>
</html>
