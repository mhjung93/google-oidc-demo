<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <!-- 제목의 "IdP RP" 는 페이지 서빙 검사 marker 다(mode3/cia_admin.html 의 관례). -->
  <title>zkID — RP 운영자</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1d3a'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3Ezk%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/common/demo.css" />
  <link rel="stylesheet" href="/common/idp.css" />
  <script src="/common/strings.js"></script>
  <script src="/common/demo.js"></script>
</head>
<body data-page="idp_rp">
<header id="demoBar"></header>
<nav class="idp-nav"><div class="nav-inner">
  <span class="brand" data-i18n="idp_brand">zkID</span>
  <div class="nav-menu"><a href="/user" data-i18n="idp_nav_user">내 계정</a><a href="/rp" aria-current="page" data-i18n="idp_nav_rp">RP 운영자</a><a href="/admin" data-i18n="idp_nav_admin">관리자</a></div>
</div></nav>
<main class="cards">
  <!-- ===== 로그인 전 ① 운영자 로그인 (2026-11-03 재구성: /user 와 같은 모양 — 로그인해야 RP 만들기가 보인다) ===== -->
  <section class="card auth-card" id="opLoginView">
    <h3 data-i18n="idp_rp_login_title">운영자 로그인</h3>
    <p class="desc" data-i18n="idp_rp_login_desc">RP(서비스)를 만들고 승인 상태를 보려면 운영자 계정으로 로그인합니다.</p>
    <form id="opLoginForm" class="auth-form" autocomplete="on">
      <label><span data-i18n="idp_rp_id_label">아이디</span><input id="opId" autocomplete="username" autocapitalize="off" spellcheck="false" /></label>
      <label><span data-i18n="idp_pwd_label">비밀번호</span><input id="opPwd" type="password" autocomplete="current-password" /></label>
      <button id="opLoginBtn" type="submit" data-i18n="idp_rp_login_btn">로그인</button>
    </form>
    <p class="auth-links"><span data-i18n="idp_no_account">계정이 없으세요?</span> <button type="button" class="btn-ghost" id="showOpSignupBtn" data-i18n="idp_rp_signup_title">운영자 계정 만들기</button></p>
    <div id="opVerdict"></div>
  </section>
  <!-- ===== 로그인 전 ② 운영자 계정 만들기 ===== -->
  <section class="card auth-card" id="opSignupView" hidden>
    <h3 data-i18n="idp_rp_signup_title">운영자 계정 만들기</h3>
    <p class="desc" data-i18n="idp_rp_signup_desc">RP 를 만들려면 운영자 계정이 필요합니다.</p>
    <form id="opSignupForm" class="auth-form" autocomplete="on">
      <label><span data-i18n="idp_rp_id_label">아이디</span><input id="opSignupId" autocomplete="username" autocapitalize="off" spellcheck="false" /></label>
      <label><span data-i18n="idp_pwd_label">비밀번호</span><input id="opSignupPwd" type="password" autocomplete="new-password" /></label>
      <label><span data-i18n="idp_pwd2_label">비밀번호 확인</span><input id="opSignupPwd2" type="password" autocomplete="new-password" /></label>
      <button id="opSignupBtn" type="submit" data-i18n="idp_rp_signup_btn">가입</button>
    </form>
    <p class="auth-links"><button type="button" class="btn-ghost" id="showOpLoginBtn" data-i18n="idp_back_to_login">로그인으로 돌아가기</button></p>
    <div id="opSignupVerdict"></div>
  </section>

  <!-- ===== 로그인 뒤 ===== -->
  <section class="card span2" id="opMeCard" hidden>
    <p class="me-head"><span class="who" id="opInfo"></span> <span class="badge ok" data-i18n="idp_rp_me_badge">운영자</span> <button id="opLogoutBtn" class="btn-ghost" data-i18n="idp_rp_logout_btn">로그아웃</button></p>
  </section>
  <section class="card span2" id="rpCreateCard" hidden>
    <h3 data-i18n="idp_rp_create_title">새 RP 만들기</h3>
    <p class="desc" data-i18n="idp_rp_create_desc">이름과 서비스 주소를 넣으면 1회용 RP 키와 기동 명령을 드립니다 — 키는 지금만 보입니다. 그 주소의 RP 서버가 등록 요청을 보내면 아래 표에서 인증서를 발급합니다.</p>
    <!-- 2026-11-06: 서비스 주소도 받는다 — RP 서버의 origin 과 맞아야 하고, 이미 같은 주소로 등록 요청을 보낸(운영자 없는) RP 가 있으면 그 자리에 묶인다. -->
    <p><label><span data-i18n="idp_rp_name_label">이름</span> <input id="rpName" size="12" placeholder="zkTHREE" autocapitalize="off" spellcheck="false" /></label> <label><span data-i18n="idp_rp_origin_label">서비스 주소</span> <input id="rpOrigin" size="28" placeholder="http://localhost:3100" autocapitalize="off" spellcheck="false" /></label> <button id="rpCreateBtn" data-i18n="idp_rp_create_btn">만들기</button></p>
    <p class="muted" data-i18n="idp_rp_key_once">키는 지금만 보입니다 — 복사해 두세요. 다시 볼 수 없습니다.</p>
    <div id="rpVerdict"></div>
    <h4 data-i18n="idp_rp_list_title">내 RP</h4>
    <div id="rpList"><p class="muted" data-i18n="idp_rp_list_empty">아직 만든 RP 가 없습니다.</p></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body ?? {}) }).then(async (r) => ({ status: r.status, body: await r.json().catch(() => null) }));
  const get = (url) => fetch(url, { credentials: 'same-origin' }).then(async (r) => ({ status: r.status, body: await r.json().catch(() => null) }));
  const tt = (k, v) => { const s = Demo.t(k, v); return s === k ? '' : s; };
  const verdict = (el, ok, title, extra) => Demo.verdict(el, () => ({ ok, title: window.DemoStrings?.verdicts?.[title] ? title : Demo.t(title), ...(typeof extra === 'function' ? extra() : extra) }));
  /** 결과 칸 비우기 — Demo.verdict 는 null 을 받지 않으므로 판정 클래스와 내용만 지운다(화면 전환·로그아웃 때). cia_user.html 과 같다. */
  const clearVerdict = (el) => { el.__verdictArgs = null; el.innerHTML = ''; el.classList.remove('verdict', 'ok', 'bad', 'pending'); };
  const copyBtn = (text) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'copy-btn'; b.textContent = '⧉';
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); } catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } finally { ta.remove(); } }
      const prev = b.textContent; b.textContent = tt('rp_copied') || '복사됨'; b.classList.add('copied');
      setTimeout(() => { b.textContent = prev; b.classList.remove('copied'); }, 1200);
    });
    return b;
  };
  // /cia/rp/me 는 key 를 내지 않는다(해시만 저장돼 있다) — 지금 세션에서 /cia/rp/create 가 준 값만 한 번 기억해 둔다.
  // 페이지를 새로 고치면 사라진다("다시 볼 수 없음" — HEAD a716a19).
  const justCreated = {};   // name -> { key, command }
  const statusBadgeClass = (status) => status === 'approved' ? 'ok' : status === 'denied' ? 'bad' : status === 'pending' ? 'warn' : 'muted';
  let myRps = [];   // renderGuide() 가 읽는다 — 이 운영자의 RP 중 승인된 것이 있는지(마지막 /cia/rp/me 결과)
  let opMe = null;  // /cia/rp/me 의 { id } — 로그인돼 있으면 값, 아니면 null

  // 안내(Task 17b): 공통 레이어가 2026-11-03 부터 바에 아무것도 그리지 않지만, 호출 모양은 다른 페이지와 같게 둔다.
  function renderGuide() {
    const links = { admin: '/admin', idp_user: '/user' };
    const approved = myRps.some((s) => s.status === 'approved');
    if (Demo.tour?.enabled) { Demo.tour.evaluate({ progress: { approved }, links }); return; }
    const done = approved ? ['rp_create', 'approve'] : [];
    Demo.guide({ done, current: approved ? null : 'rp_create', links });
  }

  /** 세 화면 중 하나만 보인다: 로그인 전엔 login|signup, 로그인 뒤엔 me(운영자 줄 + RP 만들기·내 RP). */
  function showView(v) {
    $('opLoginView').hidden = v !== 'login';
    $('opSignupView').hidden = v !== 'signup';
    $('opMeCard').hidden = v !== 'me';
    $('rpCreateCard').hidden = v !== 'me';
    if (v === 'login') setTimeout(() => $($('opId').value ? 'opPwd' : 'opId').focus(), 0);
    if (v === 'signup') setTimeout(() => $('opSignupId').focus(), 0);
  }

  function renderRpList() {
    const box = $('rpList');
    if (myRps.length === 0) { box.innerHTML = ''; box.appendChild(Object.assign(document.createElement('p'), { className: 'muted', textContent: tt('idp_rp_list_empty') || '아직 만든 RP 가 없습니다.' })); return; }
    const table = document.createElement('table');
    table.className = 'list';
    const thead = document.createElement('tr');
    for (const k of ['idp_rp_col_name', 'idp_rp_col_status', 'idp_rp_col_cert', 'idp_rp_col_origin', 'idp_rp_col_key', 'idp_rp_col_command']) {
      const th = document.createElement('th'); th.dataset.i18n = k; th.textContent = Demo.t(k); thead.appendChild(th);
    }
    table.appendChild(thead);
    for (const s of myRps) {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td'); nameTd.textContent = s.name; tr.appendChild(nameTd);
      const statusTd = document.createElement('td');
      // 2026-11-05: 상태는 영어 코드가 아니라 말로(모르는 상태면 코드 그대로), 주소 열은 줄이 꺾이지 않게.
      const badge = document.createElement('span'); badge.className = `badge ${statusBadgeClass(s.status)}`; badge.textContent = tt(`idp_rp_status_${s.status}`) || s.status; badge.style.whiteSpace = 'nowrap'; statusTd.appendChild(badge); tr.appendChild(statusTd);
      // 인증서 열(2026-11-06): RP 서버가 등록 요청을 보낸 뒤(pending)에 운영자가 "인증서 발급 요청" 을 누르고, 관리자가 승인하면 "발급됨".
      const certTd = document.createElement('td'); certTd.style.whiteSpace = 'nowrap';   // 2026-11-06: 좁은 표에서 배지·버튼이 세로로 꺾이지 않게
      if (s.status === 'pending' && s.certRequestedAt) {
        const w = document.createElement('span'); w.className = 'badge warn'; w.textContent = tt('idp_rp_cert_requested') || '승인 대기 — 관리자가 승인하면 발급됩니다'; certTd.appendChild(w);
      } else if (s.status === 'pending') {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = tt('idp_rp_request_btn') || '인증서 발급 요청'; b.disabled = requesting.has(s.name);
        b.addEventListener('click', () => requestCert(s.name, b)); certTd.appendChild(b);
      } else if (s.status === 'retired') { certTd.textContent = '-'; }
      else if (s.status === 'approved') { const ok = document.createElement('span'); ok.className = 'badge ok'; ok.textContent = tt('idp_rp_cert_issued') || '발급됨'; certTd.appendChild(ok); }
      else if (s.status === 'denied') { certTd.className = 'muted'; certTd.textContent = tt('idp_rp_cert_denied') || '거부됨 — 발급 불가'; }
      else { certTd.className = 'muted'; certTd.textContent = tt('idp_rp_cert_wait_server_short') || 'RP 서버 기동 전'; certTd.title = tt('idp_rp_cert_wait_server') || ''; }   // 긴 안내는 툴팁으로
      tr.appendChild(certTd);
      const originTd = document.createElement('td'); originTd.textContent = s.origin ?? '-'; originTd.style.whiteSpace = 'nowrap'; tr.appendChild(originTd);
      const cached = justCreated[s.name] ?? null;   // 2026-11-06: 묶여서 바로 '발급 대기' 가 된 슬롯도 1회용 키를 보인다(이 세션에서 만든 것만)
      const keyTd = document.createElement('td');
      if (cached) { const code = document.createElement('code'); code.textContent = cached.key; keyTd.append(code, ' ', copyBtn(cached.key)); }
      else { keyTd.className = 'muted'; keyTd.textContent = tt('idp_rp_key_hidden') || '(다시 볼 수 없음)'; }
      tr.appendChild(keyTd);
      const cmdTd = document.createElement('td');
      if (cached) { const code = document.createElement('code'); code.textContent = cached.command; cmdTd.append(code, ' ', copyBtn(cached.command)); }
      else cmdTd.textContent = '-';
      tr.appendChild(cmdTd);
      table.appendChild(tr);
    }
    box.innerHTML = ''; box.appendChild(table);
  }
  /** 로그인 상태와 내 RP 목록을 다시 읽는다. 로그아웃 상태에서 가입 화면을 보고 있었다면 그대로 둔다. */
  let lastListSig = null;   // 표는 내용이 바뀌었을 때만 다시 그린다 — 5초 갱신이 키 드래그 선택을 풀지 않게(2026-11-06 리뷰 MEDIUM-1)
  async function refreshRpList() {
    const r = await get('/cia/rp/me');
    opMe = r.status === 200 ? { id: r.body.id } : null;
    myRps = opMe ? (r.body.rps ?? []) : [];
    $('opInfo').textContent = opMe ? (tt('idp_rp_me_who', { id: opMe.id }) || `운영자 ${opMe.id}`) : '';
    const sig = JSON.stringify([Demo.lang, opMe, myRps, Object.keys(justCreated), [...requesting]]);
    if (sig !== lastListSig) { lastListSig = sig; renderRpList(); }
    // 세션이 다른 길로 끝났을 때(다른 탭 로그아웃·만료) 이전 운영자의 결과·키가 다음 사람에게 보이지 않게 비운다.
    if (!opMe) { clearVerdict($('rpVerdict')); for (const k of Object.keys(justCreated)) delete justCreated[k]; }
    if (opMe) showView('me'); else if ($('opSignupView').hidden) showView('login');
    renderGuide();
  }

  $('showOpSignupBtn').addEventListener('click', () => { clearVerdict($('opVerdict')); showView('signup'); });
  $('showOpLoginBtn').addEventListener('click', () => { clearVerdict($('opSignupVerdict')); showView('login'); });
  // 가입: 아이디·비밀번호·확인. 성공하면 로그인 화면으로 돌아오고 아이디가 채워져 있다 — 비밀번호는 다시 넣는다(화면·메모리에 남기지 않는다).
  $('opSignupForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const id = $('opSignupId').value.trim();
    const pwd = $('opSignupPwd').value, pwd2 = $('opSignupPwd2').value;
    if (pwd !== pwd2) { verdict($('opSignupVerdict'), false, 'idp_rp_signup_failed', { reason: 'pwd_mismatch' }); $('opSignupPwd2').value = ''; $('opSignupPwd2').focus(); return; }
    const r = await post('/cia/rp/signup', { id, pwd });
    $('opSignupPwd').value = ''; $('opSignupPwd2').value = '';
    if (r.status !== 201) { verdict($('opSignupVerdict'), false, 'idp_rp_signup_failed', { reason: r.body?.reason ?? `HTTP ${r.status}`, detail: r.body }); return; }
    clearVerdict($('opSignupVerdict'));
    $('opId').value = r.body.id; $('opPwd').value = '';
    showView('login');
    verdict($('opVerdict'), true, 'idp_rp_signup_ok_title', () => ({ summary: tt('idp_rp_signup_ok', { id: r.body.id }) || `가입됨 — 아이디 ${r.body.id}. 비밀번호를 넣고 로그인하세요.` }));
  });
  $('opLoginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const id = $('opId').value.trim();
    const pwd = $('opPwd').value;
    const r = await post('/cia/rp/login', { id, pwd });
    $('opPwd').value = '';
    if (r.status !== 200) { verdict($('opVerdict'), false, 'login_failed', { reason: r.body?.reason ?? `HTTP ${r.status}` }); return; }
    clearVerdict($('opVerdict'));
    await refreshRpList();
  });
  $('opLogoutBtn').addEventListener('click', async () => {
    await post('/cia/rp/logout');
    // 로그아웃 뒤 다른 운영자가 로그인할 수 있다 — 이 세션에서 지금만 기억해 둔 키·명령(justCreated)은 그 운영자 것이 아니므로 비운다.
    for (const k of Object.keys(justCreated)) delete justCreated[k];
    clearVerdict($('rpVerdict'));
    $('opId').value = '';
    await refreshRpList();
  });
  $('rpCreateBtn').addEventListener('click', async () => {
    const r = await post('/cia/rp/create', { name: $('rpName').value.trim(), origin: $('rpOrigin').value.trim() });
    if (r.status === 201) {
      justCreated[r.body.name] = { key: r.body.key, command: r.body.command };
      $('rpName').value = ''; $('rpOrigin').value = '';
      // 2026-11-06: 같은 주소의 RP 서버가 이미 등록 요청을 보냈으면(묶임) 다음 할 일은 명령 실행이 아니라 표의 "인증서 발급 요청" 이다. 상태는 표가 보인다.
      const k = r.body.arid ? 'idp_rp_create_ok_bound' : 'idp_rp_create_ok';
      verdict($('rpVerdict'), true, 'idp_rp_create_ok_title', () => ({ summary: tt(k, { name: r.body.name }) || `만들어짐 — ${r.body.name}.` }));
    } else {
      verdict($('rpVerdict'), false, 'idp_rp_create_failed', { reason: r.body?.reason ?? `HTTP ${r.status}`, detail: r.body });
    }
    await refreshRpList();
  });

  /** 운영자 "인증서 발급 요청"(2026-11-06): 요청만 적는다 — 발급(승인)은 zkID 관리자가 /admin 에서 하고, 승인되면 표가 "발급됨" 으로 바뀐다(5초 갱신). */
  const requesting = new Set();   // 요청 중인 이름 — 갱신으로 표가 다시 그려져도 버튼은 비활성(리뷰 LOW-2)
  async function requestCert(name, btn) {
    if (requesting.has(name)) return;
    requesting.add(name); btn.disabled = true;
    try {
      const r = await post('/cia/rp/request_cert', { name });
      if (r.status === 200) verdict($('rpVerdict'), true, 'idp_rp_request_ok_title', () => ({ summary: tt('idp_rp_request_ok', { name }) || `${name} 의 인증서 발급을 요청했습니다. zkID 관리자가 승인하면 발급됩니다.` }));
      else verdict($('rpVerdict'), false, 'idp_rp_request_failed', { reason: r.body?.reason ?? `HTTP ${r.status}`, detail: r.body });
    } finally { requesting.delete(name); }
    await refreshRpList();
  }

  Demo.init({ page: 'idp_rp' });
  Demo.stack?.({ self: 'aa', urls: {} });
  refreshRpList();
  // 2026-11-06: RP 서버가 등록 요청을 보내면(만들어짐 → 발급 대기) 표가 스스로 바뀌게 5초마다 다시 읽는다(로그인 중·탭이 보일 때만).
  setInterval(() => { if (opMe && !document.hidden) refreshRpList(); }, 5000);
</script>
</body>
</html>
