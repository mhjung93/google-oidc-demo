<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/>
    </marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700;fill:#111827}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#374151}
      .box{fill:#ffffff;stroke:#111827;stroke-width:2.1;rx:10;ry:10}
      .accent{fill:#eef6ff;stroke:#1f77b4;stroke-width:2.1;rx:10;ry:10}
      .warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:10;ry:10}
      .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:10;ry:10}
      .line{stroke:#30363d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#64748b;stroke-width:2.1;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .blocked{stroke:#b91c1c;stroke-width:2.6;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>

  <rect x="0" y="0" width="1250" height="760" fill="#ffffff"/>
  <text x="60" y="62" class="title">RP-Initiated Record-Based Opening</text>

  <rect x="70" y="145" width="245" height="150" class="accent"/>
  <text x="155" y="182" class="label">RP</text>
  <text x="95" y="218" class="body">Disputed session</text>
  <text x="95" y="246" class="small">retained transcript:</text>
  <text x="95" y="270" class="small">auth_digest_i, auid, arid_i,</text>
  <text x="95" y="294" class="small">nonce_i, assertion, evidence</text>

  <rect x="430" y="125" width="270" height="180" class="box"/>
  <text x="490" y="162" class="label">Authority</text>
  <text x="455" y="198" class="body">Approves only:</text>
  <text x="455" y="226" class="small">specific transcript</text>
  <text x="455" y="250" class="small">supporting evidence</text>
  <text x="455" y="274" class="small">retention window and scope</text>

  <rect x="830" y="145" width="300" height="150" class="box"/>
  <text x="965" y="182" class="label">IdP</text>
  <text x="855" y="218" class="body">Retained issuance record</text>
  <text x="855" y="246" class="small">indexed by auth_digest_i</text>
  <text x="855" y="270" class="small">contains uid_auth and issuance data</text>

  <path d="M315 215 L430 215" class="line"/>
  <text x="330" y="198" class="small">1. request opening</text>

  <path d="M700 215 L830 215" class="line"/>
  <text x="720" y="198" class="small">2. scoped authorization</text>

  <path d="M315 360 C455 430 700 430 830 360" class="line"/>
  <text x="430" y="418" class="body">3. RP provides transcript + auth_digest_i + evidence</text>

  <rect x="850" y="405" width="260" height="100" class="muted"/>
  <text x="875" y="438" class="body">4. Record join</text>
  <text x="875" y="466" class="small">L_idp[auth_digest_i]</text>
  <text x="875" y="490" class="small">returns authorized uid</text>

  <path d="M830 535 C700 600 465 600 315 535" class="line"/>
  <text x="430" y="586" class="body">5. opening result for the authorized session</text>

  <rect x="70" y="610" width="1060" height="85" class="warn"/>
  <text x="95" y="644" class="body">Not supported:</text>
  <text x="225" y="644" class="small">IdP-initiated global RP discovery, uid-wide search, or broadcast to all RPs.</text>
  <text x="95" y="674" class="body">Privacy cost:</text>
  <text x="205" y="674" class="small">after opening, that RP can associate uid with prior activity under the same RP-local auid.</text>

  <path d="M980 315 C1020 500 520 560 200 330" class="blocked"/>
  <text x="380" y="520" class="small" fill="#b91c1c">blocked discovery channel</text>
</svg>
