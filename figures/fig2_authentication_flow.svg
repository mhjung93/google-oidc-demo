<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/>
    </marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .actor{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#374151}
      .box{fill:#ffffff;stroke:#111827;stroke-width:2;rx:10;ry:10}
      .accent{fill:#eef6ff;stroke:#1f77b4;stroke-width:2;rx:10;ry:10}
      .calc{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.8;rx:10;ry:10}
      .lifeline{stroke:#9ca3af;stroke-width:2;stroke-dasharray:8 8}
      .msg{stroke:#30363d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="820" fill="#ffffff"/>
  <text x="60" y="60" class="title">PairCT Authentication Flow</text>

  <rect x="90" y="95" width="170" height="58" class="box"/>
  <text x="145" y="132" class="actor">RP</text>
  <rect x="435" y="95" width="170" height="58" class="accent"/>
  <text x="485" y="132" class="actor">Wallet</text>
  <rect x="780" y="95" width="170" height="58" class="box"/>
  <text x="830" y="132" class="actor">IdP</text>
  <rect x="1085" y="95" width="170" height="58" class="box"/>
  <text x="1130" y="132" class="actor">RP Verify</text>

  <line x1="175" y1="153" x2="175" y2="730" class="lifeline"/>
  <line x1="520" y1="153" x2="520" y2="730" class="lifeline"/>
  <line x1="865" y1="153" x2="865" y2="730" class="lifeline"/>
  <line x1="1170" y1="153" x2="1170" y2="730" class="lifeline"/>

  <path d="M175 205 L520 205" class="msg"/>
  <text x="230" y="190" class="body">1. sid_i, ctx_i, exp_i, RP metadata</text>

  <rect x="395" y="235" width="250" height="135" class="calc"/>
  <text x="418" y="264" class="body">2. Wallet checks origin</text>
  <text x="418" y="292" class="small">rid = H(origin, client_id, metadata)</text>
  <text x="418" y="320" class="small">sample rho_i, eta_i</text>
  <text x="418" y="348" class="small">compute auid, arid_i, auid_i</text>

  <rect x="370" y="395" width="300" height="120" class="calc"/>
  <text x="392" y="425" class="body">3. Bind session transcript</text>
  <text x="392" y="453" class="small">nonce_i = H(pk_i, arid_i, sid_i, ctx_i, exp_i, eta_i)</text>
  <text x="392" y="481" class="small">auth_digest_i = H(arid_i, auid_i, nonce_i, exp_i)</text>

  <path d="M520 550 L865 550" class="msg"/>
  <text x="565" y="535" class="body">4. pi_i^IdP, C_u, blinded artifacts</text>

  <rect x="735" y="575" width="260" height="95" class="calc"/>
  <text x="760" y="605" class="body">5. IdP checks</text>
  <text x="760" y="633" class="small">pi_i^IdP and active C_u</text>
  <text x="760" y="661" class="small">signs auth_digest_i, exp_i</text>

  <path d="M865 700 L520 700" class="msg"/>
  <text x="565" y="685" class="body">6. assertion(auth_digest_i, exp_i)</text>

  <path d="M520 745 C650 780 960 780 1170 745" class="msg"/>
  <text x="610" y="768" class="body">7. assertion, pi_i^RP, pk_i, wallet signature, session artifacts</text>

  <rect x="1045" y="575" width="250" height="95" class="calc"/>
  <text x="1068" y="605" class="body">8. RP accepts iff</text>
  <text x="1068" y="633" class="small">assertion, pi_i^RP, signature,</text>
  <text x="1068" y="661" class="small">freshness, same-context bindings verify</text>
</svg>
