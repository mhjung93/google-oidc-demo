<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom IdP Login</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }

    input {
      margin: 5px;
      padding: 8px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Custom IdP Login</h2>
  <p>Please enter your credentials to authorize SSO.</p>
  <div id="loginSection">
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button id="loginBtn">Login</button>
  </div>
  <div id="consentSection" style="display: none;">
    <h3>Consent Required</h3>
    <p>Allow this RP to complete SSO with the Wallet submission?</p>
    <button id="allowConsentBtn">Allow</button>
    <button id="denyConsentBtn">Deny</button>
  </div>
  <p id="status"></p>
  <script type="module" src="/idp/login_popup.js"></script>
</body>
</html>
